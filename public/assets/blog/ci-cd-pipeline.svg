<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-ci" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#151515"/>
    </linearGradient>
    <radialGradient id="glow-ci" cx="50%" cy="45%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-ci)"/>
  <ellipse cx="600" cy="280" rx="350" ry="180" fill="url(#glow-ci)"/>
  <!-- Pipeline steps -->
  <rect x="140" y="220" width="140" height="80" rx="12" fill="#1e1e1e" stroke="#3b82f6" stroke-width="2"/>
  <text x="210" y="265" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="600" font-family="sans-serif">Build</text>
  <rect x="360" y="220" width="140" height="80" rx="12" fill="#1e1e1e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="430" y="265" text-anchor="middle" fill="#8b5cf6" font-size="16" font-weight="600" font-family="sans-serif">Test</text>
  <rect x="580" y="220" width="140" height="80" rx="12" fill="#1e1e1e" stroke="#F17F0D" stroke-width="2"/>
  <text x="650" y="265" text-anchor="middle" fill="#F17F0D" font-size="16" font-weight="600" font-family="sans-serif">Analyze</text>
  <rect x="800" y="220" width="140" height="80" rx="12" fill="#1e1e1e" stroke="#22c55e" stroke-width="2"/>
  <text x="870" y="265" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="600" font-family="sans-serif">Deploy</text>
  <!-- Arrows -->
  <line x1="280" y1="260" x2="360" y2="260" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="260" x2="580" y2="260" stroke="#4b5563" stroke-width="2"/>
  <line x1="720" y1="260" x2="800" y2="260" stroke="#4b5563" stroke-width="2"/>
  <!-- Checkmarks -->
  <circle cx="210" cy="340" r="14" fill="#22c55e" opacity="0.15"/>
  <text x="210" y="345" text-anchor="middle" fill="#22c55e" font-size="16" font-family="sans-serif">✓</text>
  <circle cx="430" cy="340" r="14" fill="#22c55e" opacity="0.15"/>
  <text x="430" y="345" text-anchor="middle" fill="#22c55e" font-size="16" font-family="sans-serif">✓</text>
  <circle cx="650" cy="340" r="14" fill="#F17F0D" opacity="0.15"/>
  <text x="650" y="345" text-anchor="middle" fill="#F17F0D" font-size="16" font-family="sans-serif">!</text>
  <circle cx="870" cy="340" r="14" fill="#6b7280" opacity="0.15"/>
  <text x="870" y="345" text-anchor="middle" fill="#6b7280" font-size="16" font-family="sans-serif">—</text>
  <text x="600" y="440" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold" font-family="sans-serif">CI/CD Pipeline Intelligence</text>
  <text x="600" y="476" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="sans-serif">Catch Gaps Before They Ship</text>
</svg>