<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#F17F0D;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#F17F0D;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <ellipse cx="600" cy="315" rx="300" ry="200" fill="url(#glow1)"/>
  <!-- Bot icons -->
  <circle cx="400" cy="260" r="40" fill="#1e1e1e" stroke="#F17F0D" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" fill="#F17F0D" font-size="28" font-family="sans-serif">R</text>
  <circle cx="600" cy="200" r="40" fill="#1e1e1e" stroke="#F17F0D" stroke-width="2"/>
  <text x="600" y="208" text-anchor="middle" fill="#F17F0D" font-size="28" font-family="sans-serif">C</text>
  <circle cx="800" cy="260" r="40" fill="#1e1e1e" stroke="#F17F0D" stroke-width="2"/>
  <text x="800" y="268" text-anchor="middle" fill="#F17F0D" font-size="28" font-family="sans-serif">T</text>
  <!-- Connecting lines -->
  <line x1="440" y1="260" x2="560" y2="210" stroke="#F17F0D" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="640" y1="210" x2="760" y2="260" stroke="#F17F0D" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="440" y1="280" x2="760" y2="280" stroke="#F17F0D" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8,4"/>
  <!-- Title -->
  <text x="600" y="400" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold" font-family="sans-serif">AI-Orchestrated SDLC</text>
  <text x="600" y="440" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="sans-serif">From Intent to Production</text>
</svg>