<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-td" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#151515"/>
    </linearGradient>
    <radialGradient id="glow-td" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-td)"/>
  <ellipse cx="600" cy="300" rx="350" ry="200" fill="url(#glow-td)"/>
  <!-- Bar chart -->
  <line x1="250" y1="420" x2="950" y2="420" stroke="#262626" stroke-width="2"/>
  <line x1="250" y1="140" x2="250" y2="420" stroke="#262626" stroke-width="2"/>
  <!-- Bars - debt growing -->
  <rect x="310" y="360" width="60" height="60" rx="4" fill="#F17F0D" opacity="0.7"/>
  <rect x="420" y="310" width="60" height="110" rx="4" fill="#F17F0D" opacity="0.75"/>
  <rect x="530" y="250" width="60" height="170" rx="4" fill="#F17F0D" opacity="0.8"/>
  <rect x="640" y="200" width="60" height="220" rx="4" fill="#ef4444" opacity="0.8"/>
  <rect x="750" y="170" width="60" height="250" rx="4" fill="#ef4444" opacity="0.85"/>
  <!-- After WalnutAI - debt reduced -->
  <rect x="860" y="320" width="60" height="100" rx="4" fill="#22c55e" opacity="0.8"/>
  <!-- Labels -->
  <text x="340" y="445" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Q1</text>
  <text x="450" y="445" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Q2</text>
  <text x="560" y="445" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Q3</text>
  <text x="670" y="445" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Q4</text>
  <text x="780" y="445" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Q5</text>
  <text x="890" y="445" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600" font-family="sans-serif">+AI</text>
  <!-- Trend line -->
  <polyline points="340,355 450,305 560,245 670,195 780,165" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="600" y="530" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold" font-family="sans-serif">Managing Technical Debt</text>
  <text x="600" y="566" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="sans-serif">From Accumulation to Elimination</text>
</svg>