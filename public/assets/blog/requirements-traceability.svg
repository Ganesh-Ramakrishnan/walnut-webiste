<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-rt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#151515"/>
    </linearGradient>
    <radialGradient id="glow-rt" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#F17F0D;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#F17F0D;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-rt)"/>
  <ellipse cx="600" cy="300" rx="320" ry="200" fill="url(#glow-rt)"/>
  <!-- Nodes -->
  <circle cx="250" cy="200" r="50" fill="#1e1e1e" stroke="#F17F0D" stroke-width="2"/>
  <text x="250" y="195" text-anchor="middle" fill="#F17F0D" font-size="12" font-weight="600" font-family="sans-serif">REQ</text>
  <text x="250" y="212" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="sans-serif">Stories</text>
  <circle cx="600" cy="200" r="50" fill="#1e1e1e" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="195" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="600" font-family="sans-serif">CODE</text>
  <text x="600" y="212" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="sans-serif">Features</text>
  <circle cx="950" cy="200" r="50" fill="#1e1e1e" stroke="#22c55e" stroke-width="2"/>
  <text x="950" y="195" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600" font-family="sans-serif">TEST</text>
  <text x="950" y="212" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="sans-serif">Cases</text>
  <!-- Lines -->
  <line x1="300" y1="200" x2="550" y2="200" stroke="#F17F0D" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="650" y1="200" x2="900" y2="200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- Bidirectional arrows -->
  <line x1="300" y1="215" x2="550" y2="215" stroke="#F17F0D" stroke-width="1" opacity="0.3"/>
  <line x1="650" y1="215" x2="900" y2="215" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <!-- Coverage bars -->
  <rect x="350" y="310" width="500" height="30" rx="6" fill="#1e1e1e"/>
  <rect x="350" y="310" width="470" height="30" rx="6" fill="#22c55e" opacity="0.2"/>
  <text x="360" y="330" fill="#22c55e" font-size="12" font-weight="600" font-family="sans-serif">94% Traced</text>
  <rect x="350" y="355" width="500" height="30" rx="6" fill="#1e1e1e"/>
  <rect x="350" y="355" width="300" height="30" rx="6" fill="#F17F0D" opacity="0.2"/>
  <text x="360" y="375" fill="#F17F0D" font-size="12" font-weight="600" font-family="sans-serif">60% Covered</text>
  <text x="600" y="460" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold" font-family="sans-serif">Requirements Traceability</text>
  <text x="600" y="496" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="sans-serif">End-to-End Visibility</text>
</svg>