<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-sl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#151515"/>
    </linearGradient>
    <radialGradient id="glow-sl" cx="30%" cy="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-sl)"/>
  <ellipse cx="400" cy="300" rx="300" ry="200" fill="url(#glow-sl)"/>
  <!-- Timeline -->
  <line x1="150" y1="300" x2="1050" y2="300" stroke="#262626" stroke-width="3"/>
  <!-- Phase dots -->
  <circle cx="250" cy="300" r="20" fill="#10b981" opacity="0.9"/>
  <text x="250" y="305" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="sans-serif">REQ</text>
  <circle cx="450" cy="300" r="20" fill="#10b981" opacity="0.7"/>
  <text x="450" y="305" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="sans-serif">DEV</text>
  <circle cx="650" cy="300" r="20" fill="#F17F0D" opacity="0.7"/>
  <text x="650" y="305" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="sans-serif">TEST</text>
  <circle cx="850" cy="300" r="20" fill="#ef4444" opacity="0.5"/>
  <text x="850" y="305" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="sans-serif">PROD</text>
  <!-- Cost labels -->
  <text x="250" y="260" text-anchor="middle" fill="#10b981" font-size="18" font-weight="700" font-family="sans-serif">$1</text>
  <text x="450" y="260" text-anchor="middle" fill="#10b981" font-size="18" font-weight="700" font-family="sans-serif">$10</text>
  <text x="650" y="260" text-anchor="middle" fill="#F17F0D" font-size="18" font-weight="700" font-family="sans-serif">$100</text>
  <text x="850" y="260" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="700" font-family="sans-serif">$1000</text>
  <text x="250" y="350" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Cost to fix</text>
  <text x="450" y="350" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Cost to fix</text>
  <text x="650" y="350" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Cost to fix</text>
  <text x="850" y="350" text-anchor="middle" fill="#6b7280" font-size="11" font-family="sans-serif">Cost to fix</text>
  <!-- Arrow -->
  <text x="350" y="210" text-anchor="middle" fill="#10b981" font-size="24" font-family="sans-serif">←</text>
  <text x="430" y="210" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600" font-family="sans-serif">Shift Left</text>
  <text x="600" y="460" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold" font-family="sans-serif">Shift-Left Testing</text>
  <text x="600" y="496" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="sans-serif">Find Bugs When They Cost the Least</text>
</svg>