      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#151515"/>
    </linearGradient>
    <radialGradient id="glow-sa" cx="50%" cy="45%">
      <stop offset="0%" style="stop-color:#F17F0D;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#F17F0D;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-sa)"/>
  <ellipse cx="600" cy="280" rx="350" ry="200" fill="url(#glow-sa)"/>
  <!-- Circular flow -->
  <circle cx="600" cy="270" r="140" fill="none" stroke="#262626" stroke-width="2"/>
