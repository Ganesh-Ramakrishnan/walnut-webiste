  <circle cx="600" cy="270" r="45" fill="#F17F0D" opacity="0.1"/>
  <text x="600" y="266" text-anchor="middle" fill="#F17F0D" font-size="13" font-weight="800" font-family="sans-serif">AI</text>
  <text x="600" y="282" text-anchor="middle" fill="#F17F0D" font-size="9" font-family="sans-serif">Engine</text>
  <text x="600" y="520" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold" font-family="sans-serif">SDLC Automation</text>
  <text x="600" y="556" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="sans-serif">The Complete AI-Driven Lifecycle</text>
