  <text x="600" y="420" text-anchor="middle" fill="#6b7280" font-size="9" font-family="sans-serif">Validate</text>
  <circle cx="460" cy="270" r="35" fill="#1e1e1e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="460" y="266" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700" font-family="sans-serif">SHIP</text>
