  <text x="600" y="140" text-anchor="middle" fill="#6b7280" font-size="9" font-family="sans-serif">Stories</text>
  <circle cx="740" cy="270" r="35" fill="#1e1e1e" stroke="#3b82f6" stroke-width="2"/>
  <text x="740" y="266" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="700" font-family="sans-serif">CODE</text>
  <text x="740" y="280" text-anchor="middle" fill="#6b7280" font-size="9" font-family="sans-serif">Build</text>
  <circle cx="600" cy="410" r="35" fill="#1e1e1e" stroke="#22c55e" stroke-width="2"/>
