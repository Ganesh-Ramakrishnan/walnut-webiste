<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-cr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#151515"/>
    </linearGradient>
    <radialGradient id="glow-cr" cx="60%" cy="40%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-cr)"/>
  <ellipse cx="700" cy="260" rx="300" ry="200" fill="url(#glow-cr)"/>
  <!-- Code editor -->
  <rect x="300" y="120" width="600" height="340" rx="14" fill="#1e1e1e" stroke="#262626" stroke-width="1"/>
  <rect x="300" y="120" width="600" height="40" rx="14" fill="#181818"/>
  <circle cx="325" cy="140" r="6" fill="#ef4444"/>
  <circle cx="345" cy="140" r="6" fill="#f59e0b"/>
  <circle cx="365" cy="140" r="6" fill="#22c55e"/>
  <!-- Code lines -->
  <rect x="330" y="180" width="40" height="8" rx="4" fill="#8b5cf6" opacity="0.5"/>
  <rect x="380" y="180" width="120" height="8" rx="4" fill="#6b7280"/>
  <rect x="330" y="200" width="30" height="8" rx="4" fill="#8b5cf6" opacity="0.5"/>
  <rect x="370" y="200" width="160" height="8" rx="4" fill="#6b7280"/>
  <!-- Highlighted issue line -->
  <rect x="316" y="222" width="568" height="24" rx="4" fill="#ef4444" opacity="0.08"/>
  <rect x="330" y="228" width="50" height="8" rx="4" fill="#ef4444" opacity="0.6"/>
  <rect x="390" y="228" width="140" height="8" rx="4" fill="#6b7280"/>
  <!-- AI suggestion bubble -->
  <rect x="560" y="218" width="220" height="32" rx="8" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
  <text x="580" y="239" fill="#8b5cf6" font-size="11" font-weight="600" font-family="sans-serif">AI: Missing null check</text>
  <!-- More code -->
  <rect x="330" y="260" width="45" height="8" rx="4" fill="#8b5cf6" opacity="0.5"/>
  <rect x="385" y="260" width="100" height="8" rx="4" fill="#6b7280"/>
  <!-- Highlighted good line -->
  <rect x="316" y="280" width="568" height="24" rx="4" fill="#22c55e" opacity="0.06"/>
  <rect x="330" y="286" width="35" height="8" rx="4" fill="#22c55e" opacity="0.6"/>
  <rect x="375" y="286" width="180" height="8" rx="4" fill="#6b7280"/>
  <rect x="330" y="320" width="50" height="8" rx="4" fill="#8b5cf6" opacity="0.5"/>
  <rect x="390" y="320" width="130" height="8" rx="4" fill="#6b7280"/>
  <rect x="330" y="340" width="60" height="8" rx="4" fill="#8b5cf6" opacity="0.5"/>
  <rect x="400" y="340" width="90" height="8" rx="4" fill="#6b7280"/>
  <!-- Stats bar -->
  <rect x="330" y="390" width="80" height="24" rx="12" fill="#22c55e" opacity="0.1"/>
  <text x="345" y="406" fill="#22c55e" font-size="10" font-weight="700" font-family="sans-serif">12 Passed</text>
  <rect x="420" y="390" width="80" height="24" rx="12" fill="#ef4444" opacity="0.1"/>
  <text x="435" y="406" fill="#ef4444" font-size="10" font-weight="700" font-family="sans-serif">3 Issues</text>
  <rect x="510" y="390" width="80" height="24" rx="12" fill="#F17F0D" opacity="0.1"/>
  <text x="525" y="406" fill="#F17F0D" font-size="10" font-weight="700" font-family="sans-serif">2 Warns</text>
  <text x="600" y="530" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold" font-family="sans-serif">AI-Powered Code Review</text>
  <text x="600" y="566" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="sans-serif">Intelligent Analysis Beyond Linting</text>
</svg>