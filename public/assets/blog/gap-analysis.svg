<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ds" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    <filter id="dsLg" x="-10%" y="-10%" width="125%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="14" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bf5025"/>
      <stop offset="100%" style="stop-color:#a8441e"/>
    </linearGradient>
    <linearGradient id="platformTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8"/>
      <stop offset="100%" style="stop-color:#eaeaea"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Background geometric blocks -->
  <rect x="25" y="15" width="230" height="175" rx="12" fill="#9c3d1a" opacity="0.45"/>
  <rect x="145" y="105" width="200" height="155" rx="12" fill="#853318" opacity="0.35"/>
  <rect x="35" y="415" width="175" height="150" rx="12" fill="#9c3d1a" opacity="0.4"/>
  <rect x="135" y="465" width="155" height="135" rx="12" fill="#853318" opacity="0.3"/>

  <!-- Decorative lines -->
  <g stroke="#853318" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
    <line x1="1095" y1="535" x2="1125" y2="555"/>
    <line x1="1095" y1="553" x2="1125" y2="573"/>
    <line x1="1095" y1="571" x2="1125" y2="591"/>
    <line x1="270" y1="355" x2="292" y2="370"/>
    <line x1="270" y1="373" x2="292" y2="388"/>
  </g>

  <!-- ===== ISOMETRIC PLATFORM ===== -->
  <g filter="url(#dsLg)">
    <polygon points="720,385 940,260 1125,350 905,475" fill="url(#platformTop)"/>
    <polygon points="905,475 1125,350 1125,378 905,503" fill="#d0d0d0"/>
    <polygon points="720,385 905,475 905,503 720,413" fill="#bfbfbf"/>
  </g>

  <!-- ===== 3D DONUT CHART ===== -->
  <g transform="translate(930, 340)">
    <!-- 3D side/depth -->
    <ellipse cx="0" cy="20" rx="72" ry="42" fill="none" stroke="#7a3015" stroke-width="26" opacity="0.35"/>
    <!-- Main ring -->
    <ellipse cx="0" cy="0" rx="72" ry="42" fill="none" stroke="#bf5025" stroke-width="26"/>
    <!-- Dark segment -->
    <ellipse cx="0" cy="0" rx="72" ry="42" fill="none" stroke="#2a1810" stroke-width="26" stroke-dasharray="70 370" stroke-dashoffset="-105" opacity="0.8"/>
    <!-- Inner white -->
    <ellipse cx="0" cy="0" rx="46" ry="27" fill="#f2f2f2"/>
    <!-- Highlight shimmer -->
    <ellipse cx="-20" cy="-8" rx="18" ry="8" fill="#fff" opacity="0.25"/>
  </g>

  <!-- ===== CARD 1: Requirements checklist (top-left area) ===== -->
  <g filter="url(#ds)" transform="translate(340, 130) rotate(-1)">
    <rect width="200" height="160" rx="10" fill="#fff"/>
    <!-- Header bar -->
    <rect x="0" y="0" width="200" height="36" rx="10" fill="#f5f5f5"/>
    <rect x="130" y="0" width="70" height="36" rx="0" fill="#f5f5f5"/>
    <rect x="16" y="13" width="80" height="8" rx="4" fill="#444"/>
    <!-- Row 1 - green check -->
    <circle cx="28" cy="54" r="7" fill="#22c55e" opacity="0.9"/>
    <path d="M24,54 L27,57 L32,51" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="50" width="110" height="5" rx="2.5" fill="#999"/>
    <rect x="44" y="60" width="80" height="3.5" rx="2" fill="#ccc"/>
    <!-- Row 2 - green check -->
    <circle cx="28" cy="82" r="7" fill="#22c55e" opacity="0.9"/>
    <path d="M24,82 L27,85 L32,79" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="78" width="125" height="5" rx="2.5" fill="#999"/>
    <rect x="44" y="88" width="90" height="3.5" rx="2" fill="#ccc"/>
    <!-- Row 3 - orange warning -->
    <circle cx="28" cy="110" r="7" fill="#f59e0b" opacity="0.9"/>
    <text x="28" y="114" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif">!</text>
    <rect x="44" y="106" width="100" height="5" rx="2.5" fill="#999"/>
    <rect x="44" y="116" width="70" height="3.5" rx="2" fill="#ccc"/>
    <!-- Row 4 - red cross -->
    <circle cx="28" cy="138" r="7" fill="#ef4444" opacity="0.9"/>
    <path d="M24,134 L32,142 M32,134 L24,142" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="44" y="134" width="115" height="5" rx="2.5" fill="#999"/>
    <rect x="44" y="144" width="85" height="3.5" rx="2" fill="#ccc"/>
  </g>

  <!-- ===== CARD 2: Coverage dashboard (top-right) ===== -->
  <g filter="url(#ds)" transform="translate(750, 25)">
    <rect width="220" height="165" rx="10" fill="#fff"/>
    <!-- Header -->
    <rect x="0" y="0" width="220" height="36" rx="10" fill="#f5f5f5"/>
    <rect x="150" y="0" width="70" height="36" rx="0" fill="#f5f5f5"/>
    <rect x="16" y="13" width="100" height="8" rx="4" fill="#444"/>
    <!-- Progress bar 1 - 85% green -->
    <rect x="16" y="48" width="80" height="5" rx="2.5" fill="#888"/>
    <rect x="110" y="46" width="94" height="10" rx="5" fill="#e5e5e5"/>
    <rect x="110" y="46" width="80" height="10" rx="5" fill="#22c55e" opacity="0.85"/>
    <!-- Progress bar 2 - 60% orange -->
    <rect x="16" y="72" width="65" height="5" rx="2.5" fill="#888"/>
    <rect x="110" y="70" width="94" height="10" rx="5" fill="#e5e5e5"/>
    <rect x="110" y="70" width="56" height="10" rx="5" fill="#f59e0b" opacity="0.85"/>
    <!-- Progress bar 3 - 92% green -->
    <rect x="16" y="96" width="75" height="5" rx="2.5" fill="#888"/>
    <rect x="110" y="94" width="94" height="10" rx="5" fill="#e5e5e5"/>
    <rect x="110" y="94" width="86" height="10" rx="5" fill="#22c55e" opacity="0.85"/>
    <!-- Progress bar 4 - 35% red -->
    <rect x="16" y="120" width="70" height="5" rx="2.5" fill="#888"/>
    <rect x="110" y="118" width="94" height="10" rx="5" fill="#e5e5e5"/>
    <rect x="110" y="118" width="33" height="10" rx="5" fill="#ef4444" opacity="0.85"/>
    <!-- Summary footer -->
    <rect x="16" y="140" width="50" height="14" rx="7" fill="#22c55e" opacity="0.15"/>
    <rect x="22" y="145" width="38" height="4" rx="2" fill="#22c55e"/>
    <rect x="76" y="140" width="50" height="14" rx="7" fill="#f59e0b" opacity="0.15"/>
    <rect x="82" y="145" width="38" height="4" rx="2" fill="#f59e0b"/>
    <rect x="136" y="140" width="50" height="14" rx="7" fill="#ef4444" opacity="0.15"/>
    <rect x="142" y="145" width="38" height="4" rx="2" fill="#ef4444"/>
  </g>

  <!-- ===== CARD 3: Code analysis (center-left) ===== -->
  <g filter="url(#ds)" transform="translate(460, 320) rotate(2)">
    <rect width="180" height="130" rx="10" fill="#fff"/>
    <!-- Header -->
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#1e1e2e"/>
    <rect x="110" y="0" width="70" height="34" rx="0" fill="#1e1e2e"/>
    <!-- Colored dots in header -->
    <circle cx="16" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="30" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="44" cy="17" r="4.5" fill="#22c55e"/>
    <!-- Code lines -->
    <rect x="14" y="44" width="30" height="4" rx="2" fill="#818cf8" opacity="0.6"/>
    <rect x="50" y="44" width="70" height="4" rx="2" fill="#bbb"/>
    <!-- Highlighted line -->
    <rect x="8" y="56" width="164" height="16" rx="3" fill="#fef3c7" opacity="0.6"/>
    <rect x="14" y="60" width="20" height="4" rx="2" fill="#f59e0b" opacity="0.7"/>
    <rect x="40" y="60" width="90" height="4" rx="2" fill="#aaa"/>
    <rect x="135" y="60" width="25" height="4" rx="2" fill="#f59e0b" opacity="0.5"/>
    <!-- More code lines -->
    <rect x="14" y="80" width="25" height="4" rx="2" fill="#818cf8" opacity="0.6"/>
    <rect x="45" y="80" width="80" height="4" rx="2" fill="#bbb"/>
    <rect x="14" y="92" width="35" height="4" rx="2" fill="#818cf8" opacity="0.6"/>
    <rect x="55" y="92" width="60" height="4" rx="2" fill="#bbb"/>
    <rect x="14" y="104" width="28" height="4" rx="2" fill="#818cf8" opacity="0.6"/>
    <rect x="48" y="104" width="95" height="4" rx="2" fill="#bbb"/>
    <rect x="14" y="116" width="22" height="4" rx="2" fill="#818cf8" opacity="0.6"/>
    <rect x="42" y="116" width="50" height="4" rx="2" fill="#bbb"/>
  </g>

  <!-- ===== CARD 4: Trend chart (right of platform) ===== -->
  <g filter="url(#ds)" transform="translate(1030, 260)">
    <rect width="140" height="110" rx="10" fill="#fff"/>
    <!-- Header -->
    <rect x="14" y="14" width="60" height="7" rx="3.5" fill="#444"/>
    <!-- Grid lines -->
    <line x1="14" y1="90" x2="126" y2="90" stroke="#eee" stroke-width="1"/>
    <line x1="14" y1="72" x2="126" y2="72" stroke="#eee" stroke-width="1"/>
    <line x1="14" y1="54" x2="126" y2="54" stroke="#eee" stroke-width="1"/>
    <!-- Area fill -->
    <polygon points="20,85 40,68 60,74 80,52 100,46 120,40 120,90 20,90" fill="#bf5025" opacity="0.1"/>
    <!-- Line chart -->
    <polyline points="20,85 40,68 60,74 80,52 100,46 120,40" fill="none" stroke="#bf5025" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Data dots -->
    <circle cx="20" cy="85" r="3" fill="#bf5025"/>
    <circle cx="40" cy="68" r="3" fill="#bf5025"/>
    <circle cx="60" cy="74" r="3" fill="#bf5025"/>
    <circle cx="80" cy="52" r="3" fill="#bf5025"/>
    <circle cx="100" cy="46" r="3" fill="#bf5025"/>
    <circle cx="120" cy="40" r="4" fill="#fff" stroke="#bf5025" stroke-width="2.5"/>
  </g>

  <!-- ===== CARD 5: Status card (bottom-right near platform) ===== -->
  <g filter="url(#ds)" transform="translate(1010, 410)">
    <rect width="130" height="95" rx="10" fill="#fff"/>
    <!-- Big percentage -->
    <text x="65" y="48" text-anchor="middle" fill="#22c55e" font-size="28" font-weight="700" font-family="sans-serif">87%</text>
    <!-- Label -->
    <rect x="30" y="58" width="70" height="5" rx="2.5" fill="#999"/>
    <!-- Mini progress -->
    <rect x="18" y="74" width="94" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="18" y="74" width="82" height="8" rx="4" fill="#22c55e" opacity="0.8"/>
  </g>

  <!-- ===== CARD 6: Small alert badge (floating left) ===== -->
  <g filter="url(#ds)" transform="translate(200, 300)">
    <rect width="110" height="75" rx="10" fill="#fff"/>
    <!-- Alert icon -->
    <circle cx="55" cy="30" r="16" fill="#ef4444" opacity="0.12"/>
    <circle cx="55" cy="30" r="10" fill="#ef4444" opacity="0.2"/>
    <text x="55" y="35" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="bold" font-family="sans-serif">3</text>
    <!-- Label -->
    <rect x="22" y="54" width="66" height="5" rx="2.5" fill="#aaa"/>
    <rect x="30" y="64" width="50" height="3.5" rx="2" fill="#ddd"/>
  </g>

  <!-- ===== Connecting dotted lines between cards ===== -->
  <g stroke="#fff" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.3">
    <line x1="540" y1="290" x2="720" y2="385"/>
    <line x1="310" y1="338" x2="460" y2="360"/>
  </g>

  <!-- Plus icon -->
  <g transform="translate(1155, 598)" stroke="#853318" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
    <line x1="-8" y1="0" x2="8" y2="0"/>
    <line x1="0" y1="-8" x2="0" y2="8"/>
  </g>
</svg>